<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>gymhub</title>
<style>
:root{--surface-0:#f5f4ef;--surface-1:#faf9f5;--surface-2:#ffffff;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.2);--border-stronger:rgba(0,0,0,.4);--bg-success:#EAF3DE;--text-success:#3B6D11;--bg-warning:#FAEEDA;--text-warning:#854F0B;--text-danger:#A32D2D;--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"Cascadia Mono","JetBrains Mono",ui-monospace,Consolas,monospace;--radius:8px;--marca:#D85A30;--marca-2:#F0997B;--marca-3:#F5C4B3;--marca-4:#993C1D;--cal-0:#F1EFE8}
@media (prefers-color-scheme:dark){:root{--surface-0:#1a1a19;--surface-1:#232322;--surface-2:#2b2b29;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.2);--border-stronger:rgba(255,255,255,.4);--bg-success:#27500A;--text-success:#C0DD97;--bg-warning:#633806;--text-warning:#FAC775;--text-danger:#F09595;--cal-0:#3a3a37}}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans)}
button{font:inherit;font-size:12px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:4px 10px;cursor:pointer}
button:hover{background:var(--surface-1)}
input{font:inherit;padding:4px 8px;border:.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary)}
.app{max-width:980px;margin:0 auto}
.grupos2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.t{font-family:var(--font-mono);font-size:12px;line-height:1.5}
.marco{background:var(--surface-1);border-radius:12px;padding:12px;border:.5px solid var(--border)}
.box{background:var(--surface-2);border:.5px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}
.mut{color:var(--text-secondary)}
.lab{color:var(--text-secondary);font-size:11px;margin-bottom:6px}
.k{font-size:22px;font-weight:500;line-height:1.1}
.bar{height:8px;border-radius:4px;background:var(--surface-1);overflow:hidden;border:.5px solid var(--border)}
.bar>i{display:block;height:100%}
.fila{display:flex;justify-content:space-between;gap:8px}
.peq{font-size:11px}
.vacio{font-size:11px;color:var(--text-muted);margin-top:6px}
.rejilla{display:grid;gap:8px}
.r-panel-1{grid-template-columns:minmax(0,1fr) 170px}
.r-kpis{grid-template-columns:repeat(4,minmax(0,1fr));align-content:start}
.r-dos{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.r-dos-igual{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.r-dos-b{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.chip-nuevo{font-size:11px;padding:0 5px;border-radius:4px;background:var(--bg-warning);color:var(--text-warning)}
.rexmini svg{animation:rex-salto .8s ease-out infinite;image-rendering:pixelated}
.span4{grid-column:span 4}
.mt8{margin-top:8px}
/* cabecera y pestañas */
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.marca{font-weight:500;color:var(--marca)}
.pestanas{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:10px}
.pestanas button{border:none;border-radius:6px;padding:3px 8px;color:var(--text-secondary);font-family:var(--font-mono);font-size:12px}
.pestanas button[aria-selected=true]{color:var(--text-primary);font-weight:500;box-shadow:inset 0 -1.5px 0 var(--marca);border-radius:0}
.pestanas button .n{color:var(--text-muted);margin-right:4px}
.aviso-datos{color:var(--text-danger);font-size:11px}
/* banner de proceso */
.banner{display:none;margin-bottom:10px;padding:8px 12px;border-radius:8px;border:.5px solid var(--marca);background:var(--surface-2)}
.banner.on{display:block}
.banner .bar{margin-top:6px}
.banner.listo{border-color:var(--text-success)}
.banner.listo .bar>i{background:#1D9E75!important}
/* calendario */
.cal{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:3px}
.cal i{width:10px;height:10px;border-radius:2px;display:block}
.cal i.fut{border:.5px dashed var(--border-strong)}
.cal i.hoy{outline:1px solid var(--marca);outline-offset:1px}
/* semana */
.semana{display:flex;gap:6px;margin-bottom:10px}
.semana>div{flex:1;text-align:center;padding:4px 0;border-radius:6px;font-size:11px;min-width:0}
.semana .hecho{background:var(--bg-success);color:var(--text-success)}
.semana .hoy{border:1px solid var(--marca);color:var(--marca)}
.semana .descanso,.semana .futuro,.semana .pausa{background:var(--surface-1);color:var(--text-muted)}
/* rutina */
.rut{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:.5px solid var(--border)}
.rut:last-child{border-bottom:none}
.casillas{letter-spacing:2px;white-space:nowrap}
/* Rex */
.rex{display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.rex .sprite{position:relative;width:96px;height:84px}
.rex svg{position:absolute;inset:0;image-rendering:pixelated;shape-rendering:crispEdges}
@keyframes rex-a{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes rex-b{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@keyframes rex-salto{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
@keyframes rex-respira{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@keyframes rex-z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(1.5px,-2.5px)}}
@keyframes rex-brillo{0%,100%{opacity:.2}50%{opacity:1}}
.rex .fa{animation:rex-a 1.2s steps(1) infinite}.rex .fb{animation:rex-b 1.2s steps(1) infinite}
.rex .salta{animation:rex-salto .8s ease-out infinite}
.rex .respira{transform-origin:50% 100%;animation:rex-respira 3s ease-in-out infinite}
.rex .z{animation:rex-z 2.4s ease-in-out infinite}
.rex .brillo{animation:rex-brillo .9s ease-in-out infinite}
.bocadillo{text-align:center;font-size:11px}
@media (prefers-reduced-motion:reduce){.rex *{animation:none!important}}
/* gráficos */
svg text{font-family:var(--font-mono)}
.tt{position:fixed;pointer-events:none;background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:6px;padding:4px 8px;font-size:11px;display:none;white-space:nowrap;z-index:10;font-family:var(--font-mono)}
.pie{margin-top:8px;padding:5px 10px;border-radius:6px;background:var(--surface-2);border:.5px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.r-dos-a{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.r-dos-c{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.r-tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.r-ej{grid-template-columns:220px minmax(0,1fr)}
.md button.on,.rg button.on{background:var(--surface-1);border-color:var(--border-stronger)}
.chip{font-size:11px;padding:3px 10px;border-radius:999px;border:.5px solid var(--border-strong);cursor:pointer;background:transparent;color:var(--text-primary)}
.chip.on{background:var(--marca);border-color:var(--marca);color:#fff}
.chip2{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--surface-1);border:.5px solid var(--border);color:var(--text-secondary)}
.cel{width:14px;height:14px;border-radius:3px}
.ent{border-top:.5px solid var(--border);padding:8px 2px;cursor:pointer}
.ent:hover{background:var(--surface-1)}
.badge{font-size:10.5px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.hito{border-top:.5px solid var(--border);padding:7px 2px;color:var(--text-secondary);font-size:11.5px}
.det{display:none;margin-top:8px;padding:8px 10px;background:var(--surface-1);border-radius:6px;font-size:11.5px;line-height:1.7}
.ent.open .det{display:block}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer}
.it:hover{background:var(--surface-1)}
.it.on{background:var(--surface-1);box-shadow:inset 2px 0 0 var(--marca)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
td,th{padding:4px 6px;text-align:left;border-top:.5px solid var(--border)}
th{font-weight:400;color:var(--text-secondary);border-top:none}
a{color:inherit;text-decoration-color:var(--border-strong)}
.r-cinco{grid-template-columns:repeat(5,minmax(0,1fr))}
.up{color:var(--text-success)}.dn{color:var(--text-warning)}
.pildora{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--marca);color:#fff}
.linea-rev{display:grid;grid-template-columns:16px 1fr;gap:6px;padding:3px 0}
.recordatorio{color:var(--text-secondary);font-size:11.5px;padding:6px 0}
.recordatorio b{color:var(--text-primary);font-weight:500}
.barra-g{height:6px;border-radius:3px;background:var(--surface-1);margin-top:2px}
.barra-g>div{height:6px;border-radius:3px}
.barra-g.media{height:4px;margin-top:1px}.barra-g.media>div{height:4px;border-radius:2px;background:var(--marca-3)}
.tira{display:grid;grid-template-columns:repeat(13,16px);gap:3px;margin:10px 0 6px}
.cel-sem{width:16px;height:16px;border-radius:3px;padding:0;border:none;cursor:pointer}
.cel-sem.pausa{border:.5px dashed var(--border-stronger)}
.cel-sem.sel{outline:2px solid var(--text-primary);outline-offset:1px}
.cel-sem.despues{opacity:.35}
.qa{border-top:.5px solid var(--border);padding:6px 0;font-size:11.5px}
.mini-mes{background:var(--surface-1);border-radius:6px;padding:5px 8px}
.barras-mes{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:10px}
.barras-mes>div{flex:1;border-radius:3px 3px 0 0}
button:disabled{opacity:.4;cursor:default}
.vista{display:none}.vista.on{display:block}
.proximamente{padding:24px;text-align:center}
@media (max-width:700px){
  #e-lista{max-height:260px;overflow:auto}
  .grupos2{grid-template-columns:1fr}
  body{padding:10px}
  .r-panel-1,.r-dos,.r-dos-igual,.r-dos-b,.r-dos-a,.r-dos-c,.r-tres,.r-ej{grid-template-columns:minmax(0,1fr)}
  .r-cinco{grid-template-columns:repeat(2,minmax(0,1fr))}
  .r-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span4{grid-column:span 2}
  .cal{grid-auto-columns:minmax(8px,1fr)}
}
</style>
</head><body>
<div class="app t">
  <div class="marco">
    <div class="cab"><span><span class="marca">gymhub</span> <span class="mut" id="carpeta"></span></span><span class="mut" id="cabecera"></span></div>
    <div class="pestanas" role="tablist" id="pestanas"></div>
    <div id="aviso-datos" class="aviso-datos"></div>
    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <section class="vista" id="v-panel" data-vista="panel"></section>
    <section class="vista" id="v-progreso" data-vista="progreso"></section>
    <section class="vista" id="v-analisis" data-vista="analisis"></section>
    <section class="vista" id="v-diario" data-vista="diario"></section>
    <section class="vista" id="v-ejercicios" data-vista="ejercicios"></section>
    <section class="vista" id="v-semana" data-vista="semana"></section>
  </div>
</div>
<div class="tt" id="tt"></div>
<script>
(() => {
"use strict";
// ── Utilidades de presentación (la página no calcula cifras: solo formatea lo que trae datos.js) ──
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (x, dec = 1) => { if (x === null || x === undefined || !isFinite(x)) return "—"; const r = Math.round(x * 10 ** dec) / 10 ** dec; const [e, f] = Math.abs(r).toFixed(dec).split("."); const m = e.replace(/\B(?=(\d{3})+(?!\d))/g, "."); const fr = f && Number(f) ? "," + f.replace(/0+$/, "") : ""; return (r < 0 ? "−" : "") + m + fr; };
const DEPURAR = /depurar/.test(location.search);
// Versión de esta página (la pone el plugin al copiarla). Si datos.js trae otra, la página se ha
// actualizado en disco: se recarga sola, una vez por versión, conservando el #ancla.
const VERSION_WEB = "__GYMHUB_VERSION_WEB__";
const log = (m) => { if (DEPURAR) console.log("GYMHUB-WEB " + m); };
const VISTAS = [["panel", "Panel"], ["progreso", "Progreso"], ["analisis", "Análisis"], ["diario", "Diario"], ["ejercicios", "Ejercicios"], ["semana", "Semana"]];
const MARCA = "#D85A30", MARCA2 = "#F0997B", MARCA3 = "#F5C4B3", MARCA4 = "#993C1D", VERDE = "#1D9E75", AZUL = "#378ADD", AMBAR = "#BA7517";
const HINT = "deja tus entrenos en CONTEXTO/ y usa /gymhub:refresh";
const hace = (iso) => { if (!iso) return null; const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000); if (s < 90) return "hace un momento"; const m = s / 60; if (m < 60) return `hace ${Math.round(m)} min`; const h = m / 60; if (h < 36) return `hace ${Math.round(h)} h`; return `hace ${Math.round(h / 24)} d`; };

// Tooltip común: cualquier elemento con data-tt. El valor del atributo llega ya desescapado (lo que era
// «&lt;img…» vuelve a ser «<img…»), así que se escapa entero otra vez y solo se permiten <br> y <b>.
const tt = $("tt");
const htmlTooltip = (t) => esc(t).replace(/&lt;br&gt;/g, "<br>").replace(/&lt;(\/?)b&gt;/g, "<$1b>");
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest && e.target.closest("[data-tt]");
  if (!el) { tt.style.display = "none"; return; }
  tt.innerHTML = htmlTooltip(el.getAttribute("data-tt"));
  tt.style.display = "block";
  const x = Math.min(e.clientX + 12, window.innerWidth - tt.offsetWidth - 8);
  tt.style.left = x + "px"; tt.style.top = (e.clientY + 14) + "px";
});

// ── Estado de la página ──
let D = null;                  // último datos.js bueno
const pintados = {};           // bloque → JSON pintado (solo se repinta lo que cambia)
let vista = "panel", sub = {}; // vista activa y sus parámetros (#ejercicios/press-banca, #analisis?modo=volumen)
let navAplicada = Number(sessionStorage.getItem("gymhub-nav") || 0);
const conAncla = !!location.hash; // si se abre con #ancla, manda el ancla

function bloque(id, datos, pintar) {
  const el = $(id);
  if (!el) return;
  const k = JSON.stringify(datos ?? null);
  if (pintados[id] === k) return;
  pintados[id] = k;
  el.innerHTML = pintar(datos);
  log("pinta=" + id);
}
const forzarRepintado = (prefijo) => { for (const k of Object.keys(pintados)) if (!prefijo || k.startsWith(prefijo)) delete pintados[k]; };

// ── Router ──
function leerHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [ruta, qs] = h.split("?");
  const [v, ...resto] = ruta.split("/");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  if (resto.length) params.id = resto.join("/");
  return { v: VISTAS.some(([k]) => k === v) ? v : "panel", params };
}
function irA(v, params = {}, { escribirHash = true } = {}) {
  vista = v; sub = params;
  if (escribirHash) {
    const qs = Object.entries(params).filter(([k, x]) => k !== "id" && x).map(([k, x]) => `${k}=${encodeURIComponent(x)}`).join("&");
    const h = `#${v}${params.id ? "/" + params.id : ""}${qs ? "?" + qs : ""}`;
    if (location.hash !== h) history.replaceState(null, "", h);
  }
  pintarPestanas();
  for (const s of document.querySelectorAll(".vista")) s.classList.toggle("on", s.dataset.vista === v);
  forzarRepintado("v-" + v);
  pintarVista();
}
window.addEventListener("hashchange", () => { const { v, params } = leerHash(); irA(v, params, { escribirHash: false }); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.activeElement && document.activeElement.blur) { document.activeElement.blur(); return; }
  if (e.target.closest && e.target.closest("input,textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = Number(e.key);
  if (n >= 1 && n <= VISTAS.length) irA(VISTAS[n - 1][0]);
});
function pintarPestanas() {
  $("pestanas").innerHTML = VISTAS.map(([k, n], i) => `<button role="tab" aria-selected="${k === vista}" data-v="${k}"><span class="n">${i + 1}</span>${n}</button>`).join("");
}
$("pestanas").addEventListener("click", (e) => { const b = e.target.closest("button[data-v]"); if (b) irA(b.dataset.v); });

// ── Latido: version.js cada 1 s (0,5 s con un proceso activo); datos.js solo si cambia ──
const cargar = (fichero, alTerminar) => {
  const s = document.createElement("script");
  s.src = fichero + "?t=" + Date.now();
  s.onload = () => { s.remove(); alTerminar(true); };
  s.onerror = () => { s.remove(); alTerminar(false); };
  document.head.appendChild(s);
};
let temporizador = null, fallos = 0, fallosDatos = 0;
// Sin datos que pintar (no hay datos.js, o no se puede leer): en vez de «Cargando…» para siempre, qué hacer.
const sinDatos = () => !D && (fallos >= 2 || fallosDatos >= 3);
const programar = () => { clearTimeout(temporizador); temporizador = setTimeout(latido, D && D.proceso && D.proceso.activo ? 500 : 1000); };
function latido() {
  window.GYMHUB_VERSION = null;
  cargar("version.js", (ok) => {
    const v = window.GYMHUB_VERSION;
    if (!ok || !v) { if (++fallos >= 2) { $("aviso-datos").textContent = "No se pueden leer los datos (¿se ha movido la carpeta?). Vuelve a abrir la web con /gymhub:web."; if (sinDatos()) pintarVista(); } return programar(); }
    if (fallos) { fallos = 0; $("aviso-datos").textContent = ""; if (D) pintarComun(); }
    if (D && v === D.version) {
      if (fallosDatos) { fallosDatos = 0; $("aviso-datos").textContent = ""; pintarComun(); } // vuelve a ser la versión que ya se tiene
      refrescarRelojes(); return programar();
    }
    window.GYMHUB = null;
    cargar("datos.js", (ok2) => {
      const d = window.GYMHUB;
      if (ok2 && d && d.version === v) {
        if (fallosDatos) { fallosDatos = 0; $("aviso-datos").textContent = ""; }
        if (d.version_web && VERSION_WEB.indexOf("__") !== 0 && d.version_web !== VERSION_WEB && sessionStorage.getItem("gymhub-recarga") !== d.version_web) {
          sessionStorage.setItem("gymhub-recarga", d.version_web);
          log("recarga=" + d.version_web);
          location.reload();
          return;
        }
        D = d; log("v=" + d.version); alRecibir();
      }
      else {
        // datos.js a medias o dañado: se sigue con el último estado bueno y, si dura, se avisa (un fallo
        // suelto puede ser una publicación que llega justo entre los dos ficheros).
        log("datos-incompletos");
        if (++fallosDatos >= 3) { $("aviso-datos").textContent = "No se han podido leer los datos nuevos (datos.js incompleto o dañado): se muestra el último estado bueno. Vuelve a publicarlos con /gymhub:web."; if (sinDatos()) pintarVista(); }
      }
      programar();
    });
  });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) latido(); });

let recibido = 0;
function alRecibir() {
  // Navegación pedida por un comando (/gymhub:progreso, /gymhub:ejercicio banca…)
  const nav = D.navegar;
  if (nav && nav.id && nav.id !== navAplicada) {
    // Se aplica si es reciente (un comando acaba de pedirla), salvo en la primera carga con #ancla.
    const reciente = Date.now() - new Date(nav.t).getTime() < 120000;
    const primeraConAncla = navAplicada === 0 && conAncla && recibido === 0;
    navAplicada = nav.id; sessionStorage.setItem("gymhub-nav", String(nav.id));
    if (reciente && !primeraConAncla) {
      const p = {};
      if (nav.filtro) p[nav.vista === "ejercicios" || nav.vista === "semana" ? "id" : nav.vista === "diario" ? "f" : "filtro"] = nav.filtro;
      if (nav.modo) p.modo = nav.modo;
      if (nav.kg) p.kg = nav.kg;
      irA(nav.vista, p);
    }
  }
  recibido = Date.now();
  pintarComun();
  pintarVista();
}

// ── Cabecera y banner ──
function pintarComun() {
  const p = (D.panel && D.panel.cabecera) || {};
  const corta = String(D.carpeta || "").split("/").slice(-2).join("/");
  $("carpeta").textContent = corta ? "· " + corta : "";

// ── Rex (pixel art 13×10, con mancuerna) ──

const COL = { "#": MARCA, o: "#4A1B0C", d: "#444441", s: "#B4B2A9" };
function rexSVG(clase, { dy = 0, ojo = "abierto", pesa = "brazo", extra = "" } = {}) {
  let r = "";
  REX.forEach((fila, y) => [...fila].forEach((ch, x) => {
    if (ch === ".") return;

  }));

  } else if (pesa === "suelo") {
    r += `<rect x="8.6" y="8.7" width="3.4" height="0.4" fill="${COL.s}"/><rect x="8.3" y="8" width="0.8" height="1.8" fill="${COL.d}"/><rect x="11.6" y="8" width="0.8" height="1.8" fill="${COL.d}"/>`;

const DISFRAZ = {
  calabaza: `<rect x="9.6" y="8.3" width="2.6" height="1.7" rx="0.6" fill="#EF9F27"/><rect x="10.1" y="8.3" width="0.25" height="1.7" fill="#BA7517"/><rect x="11.3" y="8.3" width="0.25" height="1.7" fill="#BA7517"/><rect x="10.75" y="7.8" width="0.35" height="0.6" fill="#3B6D11"/>`,
  gorro: `<rect x="4" y="-0.3" width="4.2" height="0.5" fill="#F1EFE8"/><rect x="4.4" y="-1.4" width="3.2" height="1.1" fill="#E24B4A"/><rect x="6.6" y="-2" width="1.2" height="0.7" fill="#E24B4A"/><rect x="7.6" y="-2.2" width="0.8" height="0.8" rx="0.4" fill="#F1EFE8"/>`,
};
function rexSprite(estado, disfraz) {
  const d = DISFRAZ[disfraz] || "";
  if (!d) return rexSprite_(estado);
  return rexSprite_(estado).replace(/<\/svg>/g, d + "</svg>").replace(/viewBox="0 0 13 11"/g, disfraz === "gorro" ? 'viewBox="0 -2.4 13 13.4"' : 'viewBox="0 0 13 11"');
}
function rexSprite_(estado) {
  if (estado === "pr") return `<div class="salta" style="position:absolute;inset:0">${rexSVG("", { dy: -3, extra: `<text x="0.2" y="2" font-size="2" fill="#EF9F27" class="brillo">✦</text><text x="10.5" y="1.6" font-size="1.6" fill="#EF9F27" class="brillo">✦</text>` })}</div>`;

const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, Math.round(s % 60))).padStart(2, "0")}`;

  bloque("g-blq", P.bloque, (b) => `<div class="fila"><span class="lab">${b && b.programa ? `Bloque · ${esc(b.programa.toLowerCase())}` : "Últimas 6 semanas"}</span><span class="mut peq"><span style="color:${G.MARCA}">■</span> intensidad <span style="color:${G.MARCA2}">■</span> volumen</span></div>

// Calculadora de discos: consulta la tabla que trae datos.js (no calcula).
let kgUsuario = null;
function pintarDiscos(d) {
  if (!d) return;

  bloque("g-disc", { d: { barra: d.barra, paso: d.paso, hasta: d.hasta, n: Object.keys(d.tabla).length }, valor }, () => `<div class="lab">Calculadora de discos</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input id="g-kg" type="number" value="${esc(valor)}" min="${d.barra}" max="${d.hasta}" step="${d.paso}" style="width:90px" aria-label="kilos totales"><span class="mut">kg · barra ${fmt(d.barra)}</span></div>
    <div id="g-err" style="font-size:13px;color:var(--text-danger)"></div>
    <div id="g-barra" style="display:flex;align-items:center;justify-content:center;height:70px"></div>
    <div id="g-pl" class="mut peq" style="text-align:center"></div>`);
  const input = document.getElementById("g-kg");
  if (!input.dataset.ok) { input.dataset.ok = "1"; input.addEventListener("input", () => { kgUsuario = input.value; dibujarBarra(G.D.progreso.discos, input.value); }); }
  dibujarBarra(d, input.value);
}
function dibujarBarra(d, texto) {
  const err = document.getElementById("g-err"), barra = document.getElementById("g-barra"), pl = document.getElementById("g-pl");
  const v = Number(String(texto).replace(",", "."));
  if (!isFinite(v) || v < d.barra || v > d.hasta) { err.textContent = `Pon un peso entre ${G.fmt(d.barra)} y ${d.hasta} kg`; barra.innerHTML = ""; pl.textContent = ""; return; }
  const claves = Object.keys(d.tabla).map(Number);
  const exacta = claves.find((k) => Math.abs(k - v) < 1e-6);
  const cerca = exacta ?? claves.reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a));
  const discos = d.tabla[String(cerca)];
  err.textContent = exacta === undefined ? `No sale exacto con tus discos: el más cercano es ${G.fmt(cerca)} kg` : "";
  const placas = discos.map((p) => `<div title="${G.fmt(p)} kg" style="width:9px;height:${d.altos[p]}px;background:${d.colores[p]};border-radius:2px;border:.5px solid var(--border-strong)"></div>`).join("");
  barra.innerHTML = `<div style="display:flex;align-items:center;gap:2px;flex-direction:row-reverse">${placas}</div><div style="width:70px;height:5px;background:#B4B2A9"></div><div style="display:flex;align-items:center;gap:2px">${placas}</div>`;
  pl.textContent = discos.length ? "por lado: " + discos.map((p) => G.fmt(p, 2)).join(" + ") : "solo la barra";
}
})();

<script>

(() => {

const pt = (i, v) => { const a = -Math.PI / 2 + (i * Math.PI) / 3, r = (v / 100) * 85; return [130 + r * Math.cos(a), 115 + r * Math.sin(a)]; };
function radar(ejes, ahora, antes) {
  let s = "";

      <div class="mut peq" style="display:flex;gap:12px;justify-content:center"><span><span style="color:${G.MARCA}">■</span> ahora</span><span><span style="color:#888780">□</span> hace 3 meses</span></div>

  bloque("a-est", A.estancados, (e) => `<div class="lab">Estancados (4+ sem)</div><div class="peq" style="line-height:1.8">${(e || []).length ? e.map((x) => `<span style="color:var(--text-warning)">▲</span> ${esc(x.nombre)} · ${x.semanas} sem`).join("<br>") + `<br><span class="mut">sugerencia: cambiar rango o variante</span>` : `<span class="mut">Nada estancado. Bien.</span>`}</div>`);

};

<script>
// ── Vista Diario (PLAN §2.4) ──
(() => {
const G = window.gymhub, { bloque, esc, fmt } = G;
const COL = { bien: "var(--bg-success)", molestia: "#FAC775", dolor: "#E24B4A" };
const clave = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
let limite = 40, abiertas = new Set();
window.pintar_diario = () => {
  const D = G.D.diario || {};
  const cont = document.getElementById("v-diario");
  if (D.error) { cont.innerHTML = `<div class="box mut">Error al calcular esta vista: ${esc(D.error)}</div>`; delete cont.dataset.armado; return; }

    cont.innerHTML = `<div class="fila" style="margin-bottom:8px;align-items:center;flex-wrap:wrap"><div style="display:flex;gap:6px;flex-wrap:wrap" id="d-chips"></div><span class="mut peq" id="d-res"></span></div>
      <div class="rejilla r-dos-c"><div class="box" id="d-mol"></div><div class="box" id="d-sens"></div></div>
      <div class="box mt8"><div class="fila" style="align-items:center"><span class="lab" style="margin:0">Línea de tiempo</span><input id="d-q" placeholder="buscar ejercicio o nota" style="font-size:11px;width:220px" aria-label="buscar en el diario"></div><div id="d-tl" style="margin-top:6px"></div></div>`;
    cont.addEventListener("click", (e) => {

      if (e.target.closest("#d-mas")) { limite += 60; pintarLinea(true); return; }

      if (ent && !e.target.closest("a")) { const k = ent.dataset.k; abiertas.has(k) ? abiertas.delete(k) : abiertas.add(k); ent.classList.toggle("open"); }
    });

    return `<div class="fila"><span class="lab">Molestias · últimas 12 semanas</span><span class="mut peq">${["bien", "molestia", "dolor"].map((k) => `<span class="cel" style="display:inline-block;width:9px;height:9px;background:${COL[k]}"></span> ${k}`).join(" ")}</span></div>
      ${filas.length ? filas.map((z) => `<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span style="width:84px;font-size:11px">${esc(z.zona)}</span><div style="display:flex;gap:4px">${z.celdas.map((v, i) => `<div class="cel" style="${v ? `background:${COL[v]}` : "border:.5px dashed var(--border-strong)"}" data-tt="semana ${m.semanas[i].semana}: ${v || "sin menciones"}"></div>`).join("")}</div></div>`).join("") + `<div class="mut" style="font-size:10.5px;margin-left:92px;display:flex;justify-content:space-between;max-width:204px"><span>sem ${m.semanas[0].semana}</span><span>sem ${m.semanas[11].semana}</span></div>` : `<div class="vacio">Sin molestias anotadas en 12 semanas.</div>`}
      ${(av || []).map((a) => `<div class="peq" style="margin-top:6px"><span style="color:var(--text-warning)">▲</span> ${esc(a.texto)}</div>`).join("")}`;
  });

      <div class="mut peq fila"><span><span style="color:#888780">■</span> antes</span><span><span style="color:${G.MARCA}">■</span> después</span><span>sueño medio <b style="color:var(--text-primary);font-weight:500">${esc(s.sueno_medio || "—")}</b></span></div>`;
  });
  pintarLinea(false, f, q);
};
let ultimoFiltro = null;
function pintarLinea(forzar, f = ultimoFiltro?.f, q = ultimoFiltro?.q) {
  ultimoFiltro = { f, q };
  const D = G.D.diario || {};

  const lista = (D.linea || []).filter((e) => {
    if (f === "Hitos") return e.t === "h";
    if (e.t === "h") return !f && !qq;

      : `<div class="recordatorio">No hiciste el repaso esta semana · ejecuta <b>/gymhub:semana</b></div>`}</div>`);
  bloque("s-grp", w.grupos, (gs) => `<div class="fila"><span class="lab">Series por grupo</span><span class="mut" style="font-size:10.5px"><span style="color:${G.MARCA}">■</span> esta semana <span style="color:${G.MARCA3}">■</span> media 4 sem</span></div>
    ${gs.map((g) => `<div style="margin-bottom:6px" data-tt="${esc(g.nombre)}: ${fmt(g.series)} series esta semana · media de 4 semanas ${g.media4 === null ? "—" : fmt(g.media4)}${g.aviso ? " · por debajo del 70 %" : ""}"><div class="fila peq"><span>${esc(g.nombre)}${g.aviso ? ` <span class="dn">▲</span>` : ""}</span><span><b style="font-weight:500">${fmt(g.series)}</b> <span class="mut">/ ${g.media4 === null ? "—" : fmt(g.media4)}</span></span></div>
      <div class="barra-g"><div style="width:${g.pct}%;background:${g.aviso ? "#EF9F27" : G.MARCA}"></div></div><div class="barra-g media"><div style="width:${g.pct_media}%"></div></div></div>`).join("")}`);
  const desde = Math.max(0, ultima - 25);
  bloque("s-cump", { racha: w.racha, i, tira: S.semanas.slice(desde).map((x) => x.estado + x.clave) }, () => `<div class="lab">Semanas cumplidas</div>
    <div style="display:flex;align-items:baseline;gap:6px"><span class="k">${w.racha}</span><span class="mut" style="font-size:11px">seguida${w.racha === 1 ? "" : "s"} cumpliendo tu objetivo</span></div>
    <div class="tira">${S.semanas.slice(desde).map((x, j) => { const k = desde + j, [color, nombre] = ESTADO[x.estado]; return `<button class="cel-sem${k === i ? " sel" : ""}${k > i ? " despues" : ""}${x.estado === "pausa" ? " pausa" : ""}" data-ir="${k}" style="background:${color}" data-tt="sem ${x.semana} · ${x.estado === "pausa" ? "pausa" : `${x.kpis.sesiones.valor}/${x.objetivo}`} · ${nombre}" aria-label="Semana ${x.semana}: ${nombre}"></button>`; }).join("")}</div>
    <div class="mut" style="font-size:10.5px"><span style="color:#1D9E75">■</span> cumplida <span style="color:#FAC775">■</span> a 1 sesión <span style="color:#E24B4A">■</span> fallada <span style="color:var(--text-muted)">◇</span> pausa <span style="color:var(--cal-0)">■</span> en curso</div>`);
  bloque("s-qa", { r: w.repaso }, ({ r }) => `<div class="lab">Tu repaso del domingo</div>${r && r.preguntas.length ? r.preguntas.map((q) => `<div class="qa"><div class="mut" style="font-size:11px">${esc(q.pregunta)}</div><div>${esc(q.respuesta)}</div></div>`).join("")
    : `<div class="mut" style="font-size:11.5px;padding:6px 0">Sin repaso de esta semana.<br>Ejecuta <b style="color:var(--text-primary);font-weight:500">/gymhub:semana</b> en Claude Code y responde 3 preguntas.</div>`}`);
  bloque("s-mes", w.mes, (m) => `<div class="lab">${esc(m.titulo)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${[["Sesiones", fmt(m.hasta.sesiones, 0), fmt(m.anterior.sesiones, 0)], ["Toneladas", fmt(m.hasta.toneladas, 1), fmt(m.anterior.toneladas, 1)], ["PRs", fmt(m.hasta.prs, 0), fmt(m.anterior.prs, 0)], ["Semanas cumplidas", `${m.hasta.cumplidas}/${m.hasta.semanas}`, `${m.anterior.cumplidas}/${m.anterior.semanas}`]]
      .map(([n, v, a]) => `<div class="mini-mes"><div class="lab" style="margin:0">${n}</div><b style="font-weight:500">${v}</b> <span class="mut" style="font-size:10.5px">${esc(m.anterior.nombre)}: ${m.anterior.sin_datos ? "—" : a}</span></div>`).join("")}</div>
    <div class="barras-mes">${m.barras.filter((b) => !b.futura).map((b) => `<div data-tt="sem ${b.semana}: ${fmt(b.toneladas)} t" style="height:${Math.max(3, Math.round(b.pct * 0.44))}px;background:${b.seleccionada ? G.MARCA : G.MARCA2}"></div>`).join("")}</div>
    <div class="mut" style="font-size:10.5px;margin-top:3px">volumen por semana del mes</div>`);
};
// Flechas del teclado: semana anterior y siguiente (solo en esta vista y fuera de los campos de texto)
document.addEventListener("keydown", (e) => {
  if (G.vista !== "semana" || (e.target.closest && e.target.closest("input,textarea,select")) || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const S = datosSemana();
  if (!S.semanas || !S.semanas.length) return;
  e.preventDefault();
  ir(indice(S) + (e.key === "ArrowLeft" ? -1 : 1));
});
})();
</script>
</body></html>
