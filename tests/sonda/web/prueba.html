<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>gymhub · sonda F0</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--tx:#1f1e1d;--mut:#5f5e5a;--bd:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#2b2b29;--tx:#f1efe8;--mut:#b4b2a9;--bd:rgba(255,255,255,.12)}}
body{margin:0;padding:32px;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",sans-serif}
.box{background:var(--card);border:.5px solid var(--bd);border-radius:8px;padding:16px 20px;max-width:520px}
.k{font:500 44px "Cascadia Mono",ui-monospace,Consolas,monospace;color:#D85A30}
.mut{color:var(--mut);font-size:13px}#aviso{color:#A32D2D;font-size:13px}
</style></head><body>
<div class="box">
<div class="mut">gymhub · sonda de la Fase 0 · recarga de datos.js con file://</div>
<div>versión de datos <span class="k" id="v">—</span></div>
<div class="mut" id="det">esperando datos.js…</div><div id="aviso"></div>
</div>
<script>
(() => {
  // Latido: version.js (diminuto) cada 1 s, o cada 0,5 s con un proceso activo.
  // datos.js solo se carga cuando cambia la versión. La página guarda su propia copia
  // (actual): si datos.js llega roto o a medias, se ignora y se reintenta.
  let actual = null, lecturas = 0;
  const log = (m) => console.log("GYMHUB-F0 " + m);
  const $ = (id) => document.getElementById(id);
  const cargar = (fichero, alTerminar) => {
    const s = document.createElement("script");
    s.src = fichero + "?t=" + Date.now();
    s.onload = () => { s.remove(); alTerminar(true); };
    s.onerror = () => { s.remove(); alTerminar(false); };
    document.head.appendChild(s);
  };
  let temporizador = null;
  const programar = () => { clearTimeout(temporizador); temporizador = setTimeout(latido, actual && actual.proceso && actual.proceso.activo ? 500 : 1000); };
  function latido() {
    window.GYMHUB_VERSION = null;
    cargar("version.js", (ok) => {
      lecturas++;
      const v = window.GYMHUB_VERSION;
      if (!ok || !v) { $("aviso").textContent = "no se puede leer version.js"; log("error-carga"); return programar(); }
      $("aviso").textContent = "";
      if (actual && v === actual.version) { pintarDetalle(); return programar(); }
      window.GYMHUB = null;
      cargar("datos.js", (ok2) => {
        const d = window.GYMHUB;
        if (ok2 && d && d.version === v) { actual = d; log("v=" + d.version); $("v").textContent = d.version; }
        else log("datos-incompletos");
        pintarDetalle(); programar();
      });
    });
  }
  const pintarDetalle = () => { $("det").textContent = "latidos: " + lecturas + (actual && actual.proceso && actual.proceso.activo ? " · proceso activo (cada 0,5 s)" : " · cada 1 s"); };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) latido(); });
  latido();
})();
</script>
</body></html>
